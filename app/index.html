<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"
    />
    <title>拾用 · 桌面工具箱</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../shared/brand-icon.css" />
    <script src="../shared/theme.js"></script>
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-icon themed-app-icon" role="img" aria-label="拾用软件图标"></span>
        <div><strong>拾用</strong><small>你的桌面工具箱</small></div>
      </div>
      <div class="nav-label">工作空间</div>
      <nav aria-label="主导航">
        <button class="nav-item active" data-page="tools"><span>▦</span>我的工具</button>
        <button class="nav-item" data-page="all"><span>▤</span>全部工具</button>
      </nav>
      <div class="sidebar-bottom">
        <small id="version"></small>
      </div>
    </aside>
    <button
      id="toggle-sidebar"
      class="sidebar-toggle"
      aria-controls="sidebar"
      aria-expanded="true"
      aria-label="收起侧边栏"
      title="收起侧边栏"
      type="button"
    >
      <svg width="12" height="16" viewBox="0 0 12 16" fill="none" aria-hidden="true">
        <path d="M8 3 3 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <main>
      <header>
        <div class="header-leading">
          <div class="breadcrumb">工作空间 <span>/</span> <b id="breadcrumb">我的工具</b></div>
        </div>
        <div class="search-row">
          <label class="search"
            ><span>⌕</span
            ><input
              id="search"
              type="search"
              placeholder="搜索工具名称、功能或关键词…"
              aria-label="搜索工具"
            /><kbd>Ctrl K</kbd></label
          >
        </div>
      </header>
      <section id="home">
        <div class="section-heading">
          <div class="section-title-row">
            <h2 id="section-title">分类</h2>
            <div id="view-controls" class="mode-options" role="group" aria-label="查看模式">
              <button class="mode-option" data-mode="normal" aria-pressed="true">普通模式</button>
              <button class="mode-option" data-mode="hidden" aria-pressed="false">隐藏工具</button>
            </div>
            <div id="filter-controls" class="mode-options" role="group" aria-label="显示状态" hidden>
              <button class="mode-option" data-filter="all" aria-pressed="true">所有工具</button>
              <button class="mode-option" data-filter="visible" aria-pressed="false">已显示的工具</button>
              <button class="mode-option" data-filter="hidden" aria-pressed="false">已隐藏的工具</button>
            </div>
          </div>
          <button id="arrange-tools" aria-pressed="false">排列</button>
        </div>
        <button id="hidden-match-hint" class="hidden-match-hint" hidden></button>
        <p id="manage-hint" class="manage-hint" hidden>拖动卡片调整顺序，排列自动保存。</p>
        <div id="tool-grid" class="tool-grid"></div>
      </section>
      <footer>拾用 TOOLBOX <span>简单、专注、触手可及。</span></footer>
    </main>
    <div id="toast" role="status" hidden></div>
    <script src="./app.js"></script>
  </body>
</html>
