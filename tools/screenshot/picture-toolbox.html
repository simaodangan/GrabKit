<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'" />
  <title>截图工具箱</title>
  <link rel="stylesheet" href="./picture-toolbox.css" />
  <script src="../../shared/theme.js"></script>
</head>
<body>
  <div class="handle" title="拖动工具箱" aria-label="拖动工具箱"><svg viewBox="0 0 10 20" aria-hidden="true"><circle cx="3" cy="5" r="1"/><circle cx="7" cy="5" r="1"/><circle cx="3" cy="10" r="1"/><circle cx="7" cy="10" r="1"/><circle cx="3" cy="15" r="1"/><circle cx="7" cy="15" r="1"/></svg></div>
  <main aria-label="截图操作">
    <button data-action="copy" title="复制（Ctrl+C）" aria-label="复制"></button>
    <button data-action="cut" title="剪切（Ctrl+X）" aria-label="剪切"></button>
    <button class="group-start" data-action="edit" title="编辑" aria-label="编辑"></button>
    <button data-action="ocr" title="提取文字(OCR)" aria-label="提取文字(OCR)"></button>
    <button data-action="save" title="保存（Ctrl+S）" aria-label="保存"></button>
    <button class="group-start" data-action="pin" title="置顶" aria-label="置顶" aria-pressed="false"></button>
    <button data-action="hide" title="收起工具箱（保留图片；右键图片可恢复）" aria-label="收起工具箱"></button>
    <button class="group-start" data-action="close" title="删除截图（关闭图片）" aria-label="删除截图"></button>
  </main>
  <script src="./picture-toolbox.js"></script>
</body>
</html>
